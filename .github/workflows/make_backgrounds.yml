name: Make AI backgrounds

# Run once by hand. Makes the slide background photos and saves them
# in backgrounds/. The daily publisher then reuses them for free.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Make backgrounds
        run: python tools/make_backgrounds.py

      - name: Save backgrounds to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backgrounds
          git commit -m "Add AI slide backgrounds [skip ci]" || echo "Nothing new"
          git push
